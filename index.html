<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wazzr Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text: #f0f6fc;
            --muted: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 14px; padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; margin-bottom: 14px; }
        .user-name { font-size: 15px; font-weight: 700; }
        .user-id { font-size: 12px; color: var(--muted); }
        .balance-chip { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; box-shadow: 0 4px 12px var(--accent-glow); }

        .banner { background: linear-gradient(135deg, #312e81, #581c87); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 18px; text-align: center; margin-bottom: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .banner h2 { font-size: 18px; font-weight: 800; margin-bottom: 4px; color: #fff; }
        .banner p { font-size: 12px; color: rgba(255,255,255,0.8); }

        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .cat-btn.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 2px 10px var(--accent-glow); }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; }
        .card:active { transform: scale(0.96); border-color: var(--accent); }
        .card-icon { font-size: 32px; margin-bottom: 8px; }
        .card-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .card-price { font-size: 13px; font-weight: 700; color: #a5b4fc; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
        .modal-body { background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 20px; border-top: 1px solid var(--border); animation: slideUp 0.2s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .input-box { margin-top: 12px; margin-bottom: 16px; }
        .input-box label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .input-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 12px; outline: none; font-size: 14px; }

        .btn { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .btn-close { background: transparent; color: var(--muted); margin-top: 6px; }

        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-btn { background: none; border: none; color: var(--muted); font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="user-name" id="u-name">Yuklanmoqda...</div>
            <div class="user-id" id="u-id">ID: ---</div>
        </div>
        <div class="balance-chip" id="u-bal">0 UZS</div>
    </div>

    <div class="banner">
        <h2 id="b-title">⚡ WAZZR DONAT STORE</h2>
        <p id="b-desc">O'yinlarga 24/7 tezkor va arzon donat!</p>
    </div>

    <div class="categories" id="cats"></div>
    <div class="grid" id="prods"></div>

    <div class="modal" id="order-modal">
        <div class="modal-body">
            <h3 id="modal-title">Xarid qilish</h3>
            <div class="input-box">
                <label>Player ID raqamingizni kiriting:</label>
                <input type="text" id="player-id" placeholder="123456789">
            </div>
            <button class="btn" onclick="submitOrder()">Tasdiqlash va Sotib olish 🚀</button>
            <button class="btn btn-close" onclick="closeModal('order-modal')">Yopish</button>
        </div>
    </div>

    <div class="modal" id="topup-modal">
        <div class="modal-body">
            <h3>Hisobni to'ldirish</h3>
            <div class="input-box">
                <label>Summa (UZS):</label>
                <input type="number" id="topup-amt" placeholder="50000">
            </div>
            <div class="input-box">
                <label>F.I.Sh (Ism Familiyangiz):</label>
                <input type="text" id="topup-holder" placeholder="Ali Valiyev">
            </div>
            <button class="btn" onclick="submitTopup()">To'lovga o'tish 💳</button>
            <button class="btn btn-close" onclick="closeModal('topup-modal')">Yopish</button>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active">🏠 Asosiy</button>
        <button class="nav-btn" onclick="openModal('topup-modal')">💳 Balans</button>
        <button class="nav-btn" onclick="Telegram.WebApp.openTelegramLink('https://t.me/WazzR_VIP')">⚡ VIP</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let appData = {};
        let selectedProduct = null;

        async function init() {
            try {
                let r = await fetch('/api/state', { headers: { 'X-Init': tg.initData } });
                appData = await r.json();
                
                document.getElementById('u-name').innerText = appData.user.name;
                document.getElementById('u-id').innerText = 'ID: ' + appData.user.tg_id;
                document.getElementById('u-bal').innerText = appData.user.balance.toLocaleString() + ' UZS';
                
                renderCategories();
                if(appData.categories.length > 0) renderProducts(appData.categories[0].key);
            } catch(e) {
                console.error(e);
            }
        }

        function renderCategories() {
            let container = document.getElementById('cats');
            container.innerHTML = appData.categories.map((c, i) => `
                <button class="cat-btn ${i===0?'active':''}" onclick="filterCat('${c.key}', this)">${c.icon} ${c.name}</button>
            `).join('');
        }

        function renderProducts(catKey) {
            let filtered = appData.products.filter(p => p.game === catKey);
            let container = document.getElementById('prods');
            container.innerHTML = filtered.map(p => `
                <div class="card" onclick='selectProd(${JSON.stringify(p)})'>
                    <div class="card-icon">${p.icon}</div>
                    <div class="card-title">${p.title}</div>
                    <div class="card-price">${p.price.toLocaleString()} UZS</div>
                </div>
            `).join('');
        }

        function filterCat(key, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(key);
        }

        function selectProd(p) {
            selectedProduct = p;
            document.getElementById('modal-title').innerText = p.title + ' — ' + p.price.toLocaleString() + ' UZS';
            openModal('order-modal');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function submitOrder() {
            let pid = document.getElementById('player-id').value;
            if(!pid) return alert('Player ID kiriting!');
            let r = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Init': tg.initData },
                body: JSON.stringify({ product_id: selectedProduct.id, player_id: pid })
            });
            let res = await r.json();
            if(res.error === 'insufficient') {
                alert('Mablag\' yetarli emas!');
                closeModal('order-modal');
                openModal('topup-modal');
            } else if(res.error) {
                alert(res.error);
            } else {
                alert('✅ Buyurtma qabul qilindi!');
                closeModal('order-modal');
                init();
            }
        }

        async function submitTopup() {
            let amt = document.getElementById('topup-amt').value;
            let holder = document.getElementById('topup-holder').value;
            if(!amt || !holder) return alert('Barcha maydonlarni to\'ldiring!');
            let r = await fetch('/api/topup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Init': tg.initData },
                body: JSON.stringify({ amount: amt, holder_name: holder })
            });
            let res = await r.json();
            if(res.error) return alert(res.error);
            alert(`💳 Karta: ${res.card}\nEgasi: ${res.holder}\nAniq summa: ${res.exact} UZS\n\nTo'lovni amalga oshiring va admin tasdiqlashini kuting.`);
            closeModal('topup-modal');
        }

        init();
    </script>
</body>
</html>
