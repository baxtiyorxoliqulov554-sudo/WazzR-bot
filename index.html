<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wazzr Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {--bg: #0b0f19; --card: #131b2e; --accent: #6366f1; --text: #f8fafc; --muted: #94a3b8; --border: #1e293b;}
        * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif;}
        body {background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 90px;}
        header {display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card); padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border);}
        .profile-info h3 {font-size: 16px; font-weight: 700;}
        .profile-info p {font-size: 13px; color: var(--muted);}
        .balance-badge {background: rgba(99, 102, 241, 0.15); color: #818cf8; padding: 6px 12px; border-radius: 12px; font-weight: 700; font-size: 14px;}
        .banner {background: linear-gradient(135deg, #4f46e5, #9333ea); padding: 20px; border-radius: 16px; margin-bottom: 20px; text-align: center;}
        .banner h2 {font-size: 20px; font-weight: 800; margin-bottom: 6px;}
        .banner p {font-size: 13px; opacity: 0.9;}
        .categories {display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px;}
        .categories::-webkit-scrollbar {display: none;}
        .cat-btn {background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;}
        .cat-btn.active {background: var(--accent); border-color: var(--accent);}
        .products-grid {display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;}
        .prod-card {background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; transition: 0.2s;}
        .prod-card:active {transform: scale(0.96);}
        .prod-icon {font-size: 28px; margin-bottom: 8px;}
        .prod-title {font-size: 14px; font-weight: 700; margin-bottom: 4px;}
        .prod-price {font-size: 13px; color: #818cf8; font-weight: 700;}
        .modal {position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 100;}
        .modal-content {background: var(--card); width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 24px; border-top: 1px solid var(--border); max-height: 90vh; overflow-y: auto;}
        .input-group {margin-bottom: 16px;}
        .input-group label {display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600;}
        .input-group input {width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 12px; font-size: 14px; outline: none;}
        .btn {width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px;}
        .nav-bar {position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px; z-index: 50;}
        .nav-item {background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;}
        .nav-item.active {color: var(--accent);}
    </style>
</head>
<body>

    <header>
        <div class="profile-info">
            <h3 id="u-name">Yuklanmoqda...</h3>
            <p id="u-id">ID: ---</p>
        </div>
        <div class="balance-badge" id="u-balance">0 UZS</div>
    </header>

    <div class="banner">
        <h2 id="banner-title">⚡ Tezkor Donat Xizmati</h2>
        <p id="banner-desc">O'yinlaringizni avtomatik va ishonchli to'ldiring!</p>
    </div>

    <div class="categories" id="categories-container"></div>
    <div class="products-grid" id="products-container"></div>

    <!-- Buyurtma modal -->
    <div class="modal" id="order-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-bottom: 16px;">Xarid qilish</h3>
            <div class="input-group">
                <label id="modal-id-label">O'yin Player ID raqamingiz:</label>
                <input type="text" id="player-id-input" placeholder="ID raqamni kiriting...">
            </div>
            <button class="btn" onclick="submitOrder()">Davom etish 🚀</button>
            <button class="btn" style="background: transparent; color: var(--muted);" onclick="closeModal('order-modal')">Yopish</button>
        </div>
    </div>

    <!-- Hisobni to'ldirish modal -->
    <div class="modal" id="topup-modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">Hisobni to'ldirish (Maks: 500,000 UZS)</h3>
            <div class="input-group">
                <label>Summani kiriting (UZS):</label>
                <input type="number" id="topup-amount" placeholder="50000">
            </div>
            <div class="input-group">
                <label>To'lov qiluvchi F.I.Sh (Ism Familiya):</label>
                <input type="text" id="holder-name-input" placeholder="Ism Familiya">
            </div>
            <button class="btn" onclick="requestTopup()">To'lovga o'tish 💳</button>
            <button class="btn" style="background: transparent; color: var(--muted);" onclick="closeModal('topup-modal')">Yopish</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('shop')">🏠 Asosiy</button>
        <button class="nav-item" onclick="openTopupModal()">💳 Balans</button>
        <button class="nav-item" onclick="Telegram.WebApp.openTelegramLink('https://t.me/WazzR_VIP')">⚡ Yangiliklar</button>
        <button class="nav-item" onclick="Telegram.WebApp.openTelegramLink('https://t.me/WazzR_Isbot')">📜 Isbotlar</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let appData = {};
        let selectedProduct = null;
        let activeCategory = null;

        async function loadData() {
            try {
                let res = await fetch('/api/state', {
                    headers: {'X-Init': tg.initData}
                });
                appData = await res.json();
                if(appData.error) {
                    alert(appData.error);
                    return;
                }
                document.getElementById('u-name').innerText = appData.user.name;
                document.getElementById('u-id').innerText = 'ID: ' + appData.user.tg_id;
                document.getElementById('u-balance').innerText = appData.user.balance.toLocaleString() + ' UZS';
                
                if(appData.banner_text) document.getElementById('banner-title').innerText = appData.banner_text;
                if(appData.banner_desc) document.getElementById('banner-desc').innerText = appData.banner_desc;

                renderCategories();
                renderProducts(appData.categories[0]?.key);
            } catch(e) {
                console.error(e);
            }
        }

        function renderCategories() {
            let container = document.getElementById('categories-container');
            container.innerHTML = appData.categories.map((c, idx) => `
                <button class="cat-btn ${idx===0?'active':''}" onclick="renderProducts('${c.key}', this)">${c.icon} ${c.name}</button>
            `).join('');
            if(appData.categories.length > 0) activeCategory = appData.categories[0].key;
        }

        function renderProducts(catKey, btn) {
            if(btn) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            activeCategory = catKey;
            let filtered = appData.products.filter(p => p.game === catKey);
            let container = document.getElementById('products-container');
            container.innerHTML = filtered.map(p => `
                <div class="prod-card" onclick='openOrderModal(${JSON.stringify(p)})'>
                    <div class="prod-icon">${p.icon}</div>
                    <div class="prod-title">${p.title}</div>
                    <div class="prod-price">${p.price.toLocaleString()} UZS</div>
                </div>
            `).join('');
        }

        function openOrderModal(prod) {
            selectedProduct = prod;
            document.getElementById('modal-title').innerText = prod.title + ' (' + prod.price.toLocaleString() + ' UZS)';
            document.getElementById('order-modal').style.display = 'flex';
        }

        function openTopupModal() {
            document.getElementById('topup-modal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function submitOrder() {
            let pid = document.getElementById('player-id-input').value;
            if(!pid) return alert('Player ID kiriting!');
            let res = await fetch('/api/order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-Init': tg.initData},
                body: JSON.stringify({product_id: selectedProduct.id, player_id: pid})
            });
            let data = await res.json();
            if(data.error === 'insufficient') {
                alert('Mablag\' yetarli emas! Hisobingizni to\'ldiring.');
                closeModal('order-modal');
                openTopupModal();
            } else if(data.error) {
                alert(data.error);
            } else {
                alert('✅ Buyurtma qabul qilindi va adminga yuborildi!');
                closeModal('order-modal');
                loadData();
            }
        }

        async function requestTopup() {
            let amt = document.getElementById('topup-amount').value;
            let holder = document.getElementById('holder-name-input').value;
            if(!amt || amt < 1000 || amt > 500000) return alert('Summa 1,000 dan 500,000 UZS gacha bo\'lishi shart!');
            if(!holder) return alert('To\'lov qiluvchi F.I.Sh ni kiriting!');
            
            let res = await fetch('/api/topup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-Init': tg.initData},
                body: JSON.stringify({amount: amt})
            });
            let data = await res.json();
            if(data.error) {
                alert(data.error);
                return;
            }
            await fetch('/api/topup_claim', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-Init': tg.initData},
                body: JSON.stringify({id: data.id, holder_name: holder})
            });
            alert(`💳 Karta raqam: ${data.card}\nEgasi: ${data.holder}\nAniq summa: ${data.exact} UZS\n\nTo'lovni amalga oshirib, F.I.Sh yubordingiz. Admin tasdiqlashini kuting!`);
            closeModal('topup-modal');
            loadData();
        }

        loadData();
    </script>
</body>
</html>
